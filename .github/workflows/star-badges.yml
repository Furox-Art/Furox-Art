name: Star badges

on:
  schedule:
    - cron: "4/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/update_star_badges.py"
      - ".github/workflows/star-badges.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/update_star_badges.py"
      - ".github/workflows/star-badges.yml"
      - "assets/stars/**"

permissions:
  contents: read

concurrency:
  group: star-badges-${{ github.event_name == 'pull_request' && github.head_ref || 'live' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/update_star_badges.py --check

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refresh badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_star_badges.py
          python3 scripts/update_star_badges.py --check
          mkdir -p site/assets/stars
          cp assets/stars/*.svg site/assets/stars/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    if: github.event_name != 'pull_request'
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish badges
        id: deployment
        uses: actions/deploy-pages@v4
